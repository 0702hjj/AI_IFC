name: Bug 报告
description: 报告平台中的缺陷或异常行为
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写以下信息，帮助我们快速定位问题。
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 运行环境与版本信息
      placeholder: |
        - 部署方式：宿主直跑（开发 dev server / 生产 server 托管 dist）
        - 版本或 commit：
        - 操作系统 / 浏览器：
        - 相关组件：web / server / converter / edit-service
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 从初始状态开始的最小复现步骤
      placeholder: |
        1. 上传模型 ...
        2. 点击 ...
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么（可附截图）
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 相关报错日志（server / edit-service / 浏览器控制台），请脱敏
      render: shell
    validations:
      required: false
