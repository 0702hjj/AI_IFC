name: 功能建议
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请先确认该需求未在已有 issue 或 roadmap 中出现。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你想解决什么问题？在什么场景下遇到？
      placeholder: 例如：审查 IFC 模型时希望批量对比两个版本的属性变化……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: 你期望的功能形态（交互、API、输出等）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过或正在使用的其他做法
    validations:
      required: false
