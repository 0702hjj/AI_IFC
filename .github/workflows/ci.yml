name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  converter:
    name: converter (Node, IFC→XKT)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer/converter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/converter/package-lock.json
      - run: npm ci
      - run: npm test

  server:
    name: server (Go, race + vet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./... -race -count=1

  web:
    name: web (React, vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  smoke:
    name: e2e smoke (upload → convert → download)
    runs-on: ubuntu-latest
    needs: [converter, server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install converter deps
        working-directory: viewer/converter
        run: npm ci
      - name: Start backend
        working-directory: viewer/server
        run: |
          go build -o /tmp/ifcserver ./cmd/server
          /tmp/ifcserver &
          echo $! > /tmp/ifcserver.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8090/api/models > /dev/null && break
            sleep 1
          done
      - name: Run smoke
        run: viewer/scripts/smoke.sh
      - name: Stop backend
        if: always()
        run: kill "$(cat /tmp/ifcserver.pid)" 2>/dev/null || true
