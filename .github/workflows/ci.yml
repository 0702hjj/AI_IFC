name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  converter:
    name: converter (Node, IFC→XKT)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: converter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: converter/package-lock.json
      - run: npm ci
      - run: npm test

  server:
    name: server (Go, race + vet)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ai_ifc_viewer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./... -race -count=1
        env:
          VIEWER_TEST_PG_DSN: postgres://postgres:test@127.0.0.1:5432/ai_ifc_viewer_test?sslmode=disable

  web:
    name: web (React, vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  edit-service:
    name: edit-service (Python, FastAPI + ifcopenshell)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ifc
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - run: uv sync --group dev
      - run: uv run pytest -q

  mcp-server:
    name: mcp-server (Python, MCP stdio)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - run: uv sync --group dev
      - run: uv run --group dev pytest

  skill-pack:
    name: skill (aiifc pack + flows smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - name: Install test deps
        run: |
          uv venv .ci-venv
          uv pip install --python .ci-venv pytest -r skills/aiifc/requirements.txt
          echo "$GITHUB_WORKSPACE/.ci-venv/bin" >> "$GITHUB_PATH"
      - name: Run pack tests
        run: |
          python -m pytest tests/skill/ -q
      - name: Build skill bundle + archive
        run: |
          python tools/skill_pack.py --archive --output-root /tmp/skill-dist
          test -f /tmp/skill-dist/aiifc.tar.gz
          test -d /tmp/skill-dist/aiifc/references/docs/flows
          test -d /tmp/skill-dist/aiifc/templates
      - name: Verify bundle integrity
        run: |
          python -c "
          import tarfile
          names = tarfile.open('/tmp/skill-dist/aiifc.tar.gz').getnames()
          assert 'aiifc/SKILL.md' in names
          assert 'aiifc/requirements.txt' in names
          assert 'aiifc/templates/build_skeleton.py' in names
          assert 'aiifc/workflows/PLAN_DXF_IFC.md' in names
          assert 'aiifc/references/docs/flows/dxf_from_design.py' in names
          assert not any('__pycache__' in n or n.endswith('.pyc') for n in names), 'bundle leaked pyc'
          print(f'ok: {len(names)} files, clean')
          "
      - name: Flows smoke (skeleton + full_building + template + dxf)
        run: |
          cd skills/aiifc/references/docs
          python -m flows.skeleton
          python -m flows.full_building
          rm -f model.ifc
          cd /tmp
          python /tmp/skill-dist/aiifc/templates/build_skeleton.py
          cp /home/runner/work/AI_IFC/AI_IFC/skills/aiifc/references/docs/flows/design_builder.py .
          python /tmp/skill-dist/aiifc/references/docs/flows/dxf_from_design.py /home/runner/work/AI_IFC/AI_IFC/tests/skill/fixtures/sample_design.json -o plan.dxf
          test -s plan.dxf
          rm -f plan.dxf
          python /tmp/skill-dist/aiifc/references/docs/flows/dxf_from_design.py /home/runner/work/AI_IFC/AI_IFC/tests/skill/fixtures/sample_design_stair.json -o plan_stair.dxf
          test -s plan_stair.dxf
          rm -f plan_stair.dxf
          # model.ifc from the template build stays for the validation step below
      - name: Validate generated IFC
        run: |
          cd /tmp
          python -c "
          import ifcopenshell, ifcopenshell.validate
          m = ifcopenshell.open('model.ifc')
          lg = ifcopenshell.validate.json_logger()
          ifcopenshell.validate.validate(m, lg)
          assert not lg.statements, f'validation failed: {lg.statements}'
          print('IFC validation passed')
          "

  smoke:
    name: e2e smoke (upload → convert → download)
    runs-on: ubuntu-latest
    needs: [converter, server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install converter deps
        working-directory: converter
        run: npm ci
      - name: Start backend
        working-directory: server
        run: |
          go build -o /tmp/ifcserver ./cmd/server
          /tmp/ifcserver &
          echo $! > /tmp/ifcserver.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8090/api/v1/models > /dev/null && break
            sleep 1
          done
      - name: Run smoke
        run: scripts/smoke.sh
      - name: Stop backend
        if: always()
        run: kill "$(cat /tmp/ifcserver.pid)" 2>/dev/null || true

  compose-smoke:
    name: compose smoke (build + 文件存储轮 + 持久化 + pg 轮)
    runs-on: ubuntu-latest
    needs: [smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start stack (file storage round)
        run: docker compose up -d
      - name: Wait for web
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/ > /dev/null || { docker compose logs; exit 1; }
      - name: Upload fixture and wait for ready
        run: |
          ID=$(curl -sf -F "file=@converter/test/fixtures/wall-with-opening-and-window.ifc" \
            http://127.0.0.1:8080/api/v1/models | python3 -c 'import sys,json;print(json.load(sys.stdin)["data"]["id"])')
          echo "uploaded: $ID"
          echo "MODEL_ID=$ID" >> "$GITHUB_ENV"
          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(curl -sf "http://127.0.0.1:8080/api/v1/models/$ID" | python3 -c 'import sys,json;print(json.load(sys.stdin)["data"]["status"])')
            [ "$STATUS" = "ready" ] && break
            [ "$STATUS" = "failed" ] && { echo "conversion failed"; docker compose logs server; exit 1; }
            sleep 2
          done
          [ "$STATUS" = "ready" ] || { echo "timeout"; docker compose logs; exit 1; }
      - name: Verify xkt + script pipeline smoke (PUT → run → save → list)
        run: |
          curl -sf -o /dev/null -w "xkt: %{http_code} %{size_download}B\n" \
            "http://127.0.0.1:8080/v1/models/$MODEL_ID/model.xkt"
          python3 - <<'PY'
          import json, os, urllib.request

          MODEL_ID = os.environ["MODEL_ID"]
          BASE = "http://127.0.0.1:8080/api/v1/models/" + MODEL_ID

          # 最小契约合法脚本（script_lib.validate_script_contract：顶层 PARAMS
          # 字面量 dict + build(params, out_path) + __main__ 守卫）；沙箱 env
          # PYTHONPATH=flows_dir（script_runner._sandbox_env），可 import script_lib。
          SCRIPT = '''
          PARAMS = {"storeys": {"L0": 0.0}}

          import ifcopenshell
          from script_lib import create_skeleton, write_and_validate


          def build(params, out_path):
              model = ifcopenshell.file()
              create_skeleton(model, name="ci-smoke", storeys=params["storeys"])
              write_and_validate(model, out_path)


          if __name__ == "__main__":
              import sys

              build(PARAMS, sys.argv[1])
          '''

          def call(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  BASE + path, data=data, method=method,
                  headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=180) as resp:
                  d = json.load(resp)
              assert d["code"] == 0, d  # Go proxy 统一 envelope（api.go writeJSON）
              return d["data"]

          # PUT /script：整脚本入暂存（routes_scripts.stage_script 返回
          # modelId/staged/canUndo/canRedo；空 staging 首次 push 后 staged=1）
          put = call("PUT", "/script", {"script": SCRIPT, "note": "ci smoke"})
          assert put["modelId"] == MODEL_ID, put
          assert put["staged"] == 1 and put["canUndo"] and not put["canRedo"], put
          print("PUT /script OK:", put)

          # POST /script/run：沙箱执行入 uploads（routes_scripts 返回 {modelId, ok}）
          run = call("POST", "/script/run")
          assert run["modelId"] == MODEL_ID and run["ok"] is True, run
          print("POST /script/run OK")

          # POST /script/save：产大版本 v1（script_versions.save 首次 n=1；返回
          # {modelId, version, staged:0}）
          save = call("POST", "/script/save", {"note": "ci smoke"})
          assert save["modelId"] == MODEL_ID, save
          assert save["version"] == "v1" and save["staged"] == 0, save
          print("POST /script/save OK:", save)

          # GET /scripts：版本列表非空（routes_scripts.list_scripts 返回
          # {modelId, scripts:[{version,createdAt,note}], versions:[...]}）
          lst = call("GET", "/scripts")
          assert lst["modelId"] == MODEL_ID, lst
          vers = [s["version"] for s in lst["scripts"]]
          assert vers == ["v1"], lst
          assert lst["versions"], lst
          print("GET /scripts OK:", vers)

          print("script pipeline smoke OK")
          PY
      - name: Restart without -v and verify persistence
        run: |
          docker compose down
          docker compose up -d
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/ > /dev/null || { docker compose logs; exit 1; }
          curl -sf http://127.0.0.1:8080/api/v1/models \
            | python3 -c 'import sys,json,os;ids=[m["id"] for m in json.load(sys.stdin)["data"]];assert os.environ["MODEL_ID"] in ids,("model lost after restart",ids)'
          echo "persistence OK"
      - name: Tear down file storage round (wipe volumes)
        if: always()
        run: docker compose down -v
      - name: Start stack (pg round)
        run: |
          VIEWER_PG_DSN="postgres://aiifc:aiifc@postgres:5432/aiifc" \
            docker compose --profile pg up -d
      - name: Wait for web (pg round)
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/ > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/ > /dev/null || { docker compose --profile pg logs; exit 1; }
      - name: Upload fixture (pg round)
        run: |
          ID=$(curl -sf -F "file=@converter/test/fixtures/wall-with-opening-and-window.ifc" \
            http://127.0.0.1:8080/api/v1/models | python3 -c 'import sys,json;print(json.load(sys.stdin)["data"]["id"])')
          echo "uploaded (pg): $ID"
          echo "PG_MODEL_ID=$ID" >> "$GITHUB_ENV"
      - name: Verify issues endpoint via PG (POST + GET)
        run: |
          ISSUE_ID=$(curl -sf -F 'issue={"title":"ci pg smoke issue"}' \
            "http://127.0.0.1:8080/api/v1/models/$PG_MODEL_ID/issues" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["code"]==0,d;print(d["data"]["id"])')
          echo "issue created: $ISSUE_ID"
          export ISSUE_ID
          curl -sf "http://127.0.0.1:8080/api/v1/models/$PG_MODEL_ID/issues" \
            | python3 -c 'import sys,json,os;d=json.load(sys.stdin);ids=[i["id"] for i in d["data"]];assert os.environ["ISSUE_ID"] in ids,("issue missing via PG",ids)'
          echo "issues via PG OK"
      - name: Tear down
        if: always()
        run: docker compose --profile pg down -v
