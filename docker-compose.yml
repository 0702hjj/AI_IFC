# AI_IFC 一键启动：web (nginx) → server (Go+Node) → edit-service (FastAPI)
# 默认文件存储零依赖；`docker compose --profile pg up` 追加 PostgreSQL。
name: ai-ifc

services:
  web:
    build:
      context: ./viewer/web
    image: aiifc-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_started

  server:
    build:
      context: ./viewer
      dockerfile: server/Dockerfile
    image: aiifc-server
    environment:
      VIEWER_EDIT_SERVICE_URL: http://edit-service:8100
      VIEWER_PG_DSN: ${VIEWER_PG_DSN:-}
    volumes:
      - "${DATA_DIR:-aiifc-data}:/data"
    ports:
      - "${SERVER_PORT:-8090}:8090"
    depends_on:
      edit-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false

  edit-service:
    build:
      context: .
      dockerfile: viewer/edit-service/Dockerfile
    image: aiifc-edit-service
    environment:
      VIEWER_DATA_DIR: /data
    volumes:
      - "${DATA_DIR:-aiifc-data}:/data"
    ports:
      - "${EDIT_SERVICE_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8100/health')\""]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:16-alpine
    profiles: ["pg"]
    environment:
      POSTGRES_USER: ${PG_USER:-aiifc}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-aiifc}
      POSTGRES_DB: ${PG_DB:-aiifc}
    volumes:
      - aiifc-pg:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  aiifc-data:
  aiifc-pg:
