[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dxfkit"
version = "0.1.0"
description = "aidxfv3 drawing board: draw (archdxf per-component wrapper), svg (DXF export), readback (DXF -> room graph). No DSL semantics."
requires-python = ">=3.12"
dependencies = ["ezdxf", "archdxf", "floorgeom"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dxfkit*"]