[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archdxf"
version = "0.1.0"
description = "Architectural DXF drafting library for the aidxfv1 skill: wall frames, openings, fixtures, annotation primitives (self-written, ezdxf-based)."
requires-python = ">=3.12"
dependencies = ["ezdxf"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["archdxf*"]

[tool.setuptools.package-data]
archdxf = ["py.typed"]
