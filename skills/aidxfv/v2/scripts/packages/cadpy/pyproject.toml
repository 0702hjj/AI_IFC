[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadpy"
version = "0.3.13"
description = "DXF generation runtime for the aidxfv1 skill (slimmed from text-to-cad cadpy; DXF closure only)."
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["cadpy*"]

[tool.setuptools.package-data]
cadpy = ["py.typed"]
