[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floorgeom"
version = "0.1.0"
description = "aidxfv3 plan geometry kernel: derive (shapely facts), normalize (DSL -> coordinates), check (R-01~R-09), reconcile (decl vs readback). Zero design judgment."
requires-python = ">=3.12"
dependencies = ["shapely"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["floorgeom*"]