[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldlib"
version = "0.1.0"
description = "aidxfv3 reference library: reindex (files -> golden.db, stdlib sqlite3), query (feature pull), reverse (DXF -> DSL declarations), ingest (vote/correct/challenge). Files are fact source, db is reproducible derivative."
requires-python = ">=3.12"
dependencies = ["floorgeom"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["goldlib*"]